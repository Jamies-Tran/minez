services:
  minez-db-dev:
    image: mysql:latest
    container_name: minez-db-dev
    networks:
      - minez-dev
    ports:
      - "3306:3306"
    volumes:
      - ./migration/minez-migration/flyway/mysql/init:/docker-entrypoint-initdb.d
      - ./infrastructures/databases/mysql/dev/data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123
      TZ: Asia/Ho_Chi_Minh
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123" ]
      interval: 5s
      retries: 3
      timeout: 10s

  minez-db-local:
    image: mysql:latest
    container_name: minez-db-local
    networks:
      - minez-dev
    ports:
      - "3307:3306"
    volumes:
      - ./migration/minez-migration/flyway/mysql/init:/docker-entrypoint-initdb.d
      - ./infrastructures/databases/mysql/local/data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123
      TZ: Asia/Ho_Chi_Minh
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123" ]
      interval: 5s
      retries: 3
      timeout: 10s

  minez-cache-dev:
    image: redis:latest
    container_name: minez-cache-dev
    networks:
      - minez-dev
    volumes:
      - ./infrastructures/caches/redis/dev/data:/data
      - ./infrastructures/caches/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 3
      timeout: 10s


  minez-mongo-dev:
    image: mongo:latest
    container_name: minez-mongo-dev
    networks:
      - minez-dev
    volumes:
      - ./infrastructures/databases/mongo/dev/data:/data/db
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: minez
      MONGO_INITDB_ROOT_PASSWORD: 123
      MONGO_INITDB_DATABASE: auth
    healthcheck:
      test: [
        "CMD",
        "mongosh",
        "--username",
        "minez",
        "--password",
        "123",
        "--authenticationDatabase",
        "admin",
        "--eval",
        "db.adminCommand('ping').ok"
      ]
      interval: 5s
      retries: 3
      timeout: 10s

  minez-rabbitmq-dev:
    image: rabbitmq:4-management
    container_name: minez-rabbitmq-dev
    networks:
      - minez-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
       RABBITMQ_DEFAULT_USER: minez
       RABBITMQ_DEFAULT_PASS: 123
    volumes:
      - ./infrastructures/databases/rabbitmq/dev/data:/var/lib/rabbitmq

  iam-flyway-dev:
    image: flyway/flyway:latest
    container_name: iam-migration-dev
    networks:
      - minez-dev
    command:
      - "-url=jdbc:mysql://minez-db-dev:3306/iam?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh"
      - "-user=root"
      - "-password=123"
      - "migrate"
    volumes:
      - ./migration/minez-migration/flyway/mysql/administration:/flyway/sql
    depends_on:
      minez-db-dev:
          condition: service_healthy

#  auth-flyway-dev:
#    image: flyway/flyway:latest
#    container_name: auth-flyway-dev
#    networks:
#      - minez-dev
#    command:
#      - "-url=jdbc:mysql://minez-db-dev:3306/auth?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh"
#      - "-user=root"
#      - "-password=123"
#      - "migrate"
#    volumes:
#      - ./migration/minez-migration/flyway/mysql/auth:/flyway/sql
#    depends_on:
#      minez-db-dev:
#        condition: service_healthy

  discovery-dev:
    build:
      context: ./platform-services/discovery-service/.
    container_name: discovery-dev
    networks:
      - minez-dev
    ports:
      - "8761:8761"

  gateway-dev:
    build:
      context: ./platform-services/gateway/.
    container_name: gateway-dev
    networks:
      - minez-dev
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      - discovery-dev

